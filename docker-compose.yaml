services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: backend_app
    restart: always

    environment:
      DB_HOST: postgres
      PORT: 3000

    ports:
      - "3000:3000"

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend

    container_name: frontend_app
    restart: always

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  postgres_data: